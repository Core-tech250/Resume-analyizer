version: '3.8'

services:
  # Streamlit Recruiter Dashboard
  dashboard:
    build: .
    container_name: resume_shortlister_ui
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=sqlite:////app/data/resumes.db
      - EMBEDDING_MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
    volumes:
      - app_data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped

  # FastAPI REST API Backend
  api:
    build: .
    container_name: resume_shortlister_api
    ports:
      - "8000:8000"
    command: ["uvicorn", "src.resume_shortlister.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - DATABASE_URL=sqlite:////app/data/resumes.db
    volumes:
      - app_data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped

volumes:
  app_data:
